[project]
name = "claw-quant-data"
version = "0.1.0"
description = "Auditable financial data foundation for research agents"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "pandas>=2.1,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "six>=1.16,<2",
    "tushare>=1.4,<2",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
    "xlrd>=2.0,<3",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "starlette[full]>=1.3,<2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Deliberately minimal: the codebase predates a linter, so we only enforce the
# pyflakes rules that catch real bugs — undefined names (F821/F811), unused
# variables (F841), and f-string mistakes (F541) — without forcing a noisy
# one-shot reformat.
#
# Deliberately NOT enforced:
#   - F401 unused imports: ~50 legacy leftovers scattered across 40 files; a
#     dedicated cleanup pass should remove them before enabling.
#   - F541 f-strings without placeholders: 4 legacy spots (one multi-line SQL).
#   - I   import ordering: established project style.
#   - E701/E702 single-line bodies, E402 deferred imports: established style.
select = ["F"]
ignore = ["E501", "F401", "F541"]

[tool.ruff.lint.per-file-ignores]
# Generated or vendored code is not held to lint standards.
"third_party/**" = ["F"]
# service/tools/__init__.py is a deliberate re-export barrel for the legacy
# query helpers; its symbols are part of the module's public surface even
# though the functions themselves are not the Agent contract.
"service/tools/__init__.py" = ["F401", "F403"]
"service/tools/index/__init__.py" = ["F401"]
