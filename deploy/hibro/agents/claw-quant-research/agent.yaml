apiVersion: hibro.ai/v1alpha1
kind: Agent
metadata:
  name: Claw Quant Research Agent
  slug: claw-quant-research
  description: Read-only macro, industry, company, technical, event, ETF and cross-asset research over governed Claw Quant APIs
spec:
  engine: codex
  instructions: instructions.md
  skills:
    - name: claw-quant-data
      path: skills/claw-quant-data
    - name: fundamental-research
      path: skills/fundamental-research
    - name: technical-research
      path: skills/technical-research
    - name: event-research
      path: skills/event-research
    - name: cross-asset-research
      path: skills/cross-asset-research
    - name: etf-flow-research
      path: skills/etf-flow-research
    - name: macro-research
      path: skills/macro-research
    - name: industry-research
      path: skills/industry-research
  workspace:
    strategy: persistent
    access: read-only
  approvalPolicy: strict
  networkPolicy: allow
  maxConcurrency: 2
  modalities:
    - text
    - image
